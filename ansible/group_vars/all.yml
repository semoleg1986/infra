---
project_name: curs
project_root: /opt/curs
compose_filename: compose.yaml
docker_shared_network: curs_net
ghcr_registry: ghcr.io
ghcr_namespace: semoleg1986
ghcr_require_login: false
service_image_tag: latest
service_restart_policy: unless-stopped
service_default_resources: {}
docker_log_driver: json-file
docker_log_max_size: 10m
docker_log_max_file: "5"

db_user: postgres
db_password: postgres
db_host: curs_postgres
db_port: 5432
db_suffix: ""
postgres_databases:
  - "auth_service{{ db_suffix }}"
  - "users_service{{ db_suffix }}"
  - "course_service{{ db_suffix }}"
  - "attribution_service{{ db_suffix }}"
  - "live_class_service{{ db_suffix }}"
  - "payments_service{{ db_suffix }}"
  - "bonus_wallet_service{{ db_suffix }}"

auth_service_internal_url: http://curs_auth_service:8000
users_service_internal_url: http://curs_users_service:8002
course_service_internal_url: http://curs_course_service:8001
attribution_service_internal_url: http://curs_attribution_service:8000
bonus_wallet_service_internal_url: http://curs_bonus_wallet_service:8006
redis_internal_url: redis://curs_redis:6379/0
course_service_token: dev-service-token
users_service_token: "{{ course_service_token }}"
payments_service_token: "{{ course_service_token }}"
attribution_service_token: "{{ course_service_token }}"
bonus_wallet_service_token: "{{ course_service_token }}"
observability_metrics_token: "{{ course_service_token }}"
auth_jwt_private_key_pem: "{{ vault_auth_jwt_private_key_pem | default(None) }}"
auth_jwt_public_key_pem: "{{ vault_auth_jwt_public_key_pem | default(None) }}"

post_deploy_smoke_enabled: true
post_deploy_smoke_required_services:
  - auth_service
  - users_service
  - course_service
  - payments_service
smoke_auth_base_url: http://127.0.0.1:8000
smoke_users_base_url: http://127.0.0.1:8002
smoke_course_base_url: http://127.0.0.1:8001
smoke_attr_base_url: http://127.0.0.1:8003
smoke_live_base_url: http://127.0.0.1:8010
smoke_payments_base_url: http://127.0.0.1:8004
smoke_admin_email: admin@example.com
smoke_admin_password: admin12345
smoke_service_token: "{{ users_service_token }}"
smoke_attribution_service_token: "{{ attribution_service_token }}"

ops_cron_enabled: false
ops_cron_ansible_dir: /home/deploy/apps/infra/ansible
ops_cron_log_file: /var/log/curs-ops.log
ops_cron_backup_root: /home/deploy/backups/postgres
ops_cron_backup_time: "15 3 * * *"
ops_cron_rotate_time: "45 3 * * *"
ops_cron_restore_time: "0 4 * * 0"
ops_cron_restore_cleanup_time: "25 4 * * 0"
ops_cron_image_prune_time: "10 5 * * 0"
ops_cron_outbox_dispatch_time: "*/5 * * * *"
ops_cron_outbox_dispatch_limit: "100"
observability_assets_root: /home/deploy/apps/infra/ansible/files/observability
grafana_admin_user: admin
grafana_admin_password: admin
prometheus_enabled: false
grafana_enabled: false
api_public_bind_host: 0.0.0.0
web_public_bind_host: 0.0.0.0
observability_bind_host: 127.0.0.1

services:
  prometheus:
    enabled: "{{ prometheus_enabled }}"
    workdir: "{{ project_root }}/prometheus"
    image: prom/prometheus
    tag: "v2.53.1"
    container_name: curs_prometheus
    templates:
      - src: prometheus.yml.j2
        dest: "{{ project_root }}/prometheus/prometheus.yml"
        mode: "0644"
    env: {}
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --storage.tsdb.retention.time=15d
      --web.enable-lifecycle
    ports:
      - "{{ observability_bind_host }}:9090:9090"
    volumes:
      - "{{ project_root }}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "{{ observability_assets_root }}/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro"
      - "{{ project_root }}/volumes/prometheus:/prometheus"
    healthcheck:
      path: /-/healthy
      port: 9090

  grafana:
    enabled: "{{ grafana_enabled }}"
    workdir: "{{ project_root }}/grafana"
    image: grafana/grafana
    tag: "11.1.4"
    container_name: curs_grafana
    env:
      GF_SECURITY_ADMIN_USER: "{{ grafana_admin_user }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "{{ observability_bind_host }}:3005:3000"
    volumes:
      - "{{ observability_assets_root }}/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro"
      - "{{ observability_assets_root }}/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro"
      - "{{ observability_assets_root }}/grafana-dashboard-curs-api.json:/var/lib/grafana/dashboards/curs-api-health.json:ro"
      - "{{ project_root }}/volumes/grafana:/var/lib/grafana"
    healthcheck:
      path: /api/health
      port: 3005

  postgres:
    enabled: true
    workdir: "{{ project_root }}/postgres"
    image: postgres
    tag: "16-alpine"
    container_name: curs_postgres
    env:
      POSTGRES_USER: "{{ db_user }}"
      POSTGRES_PASSWORD: "{{ db_password }}"
      POSTGRES_DB: postgres
      TZ: UTC
    volumes:
      - "{{ project_root }}/volumes/postgres:/var/lib/postgresql/data"

  redis:
    enabled: true
    workdir: "{{ project_root }}/redis"
    image: redis
    tag: "7-alpine"
    container_name: curs_redis
    env: {}

  auth_service:
    enabled: true
    workdir: "{{ project_root }}/auth_service"
    image: "{{ ghcr_registry }}/{{ ghcr_namespace }}/auth_service"
    tag: "{{ service_image_tags.auth_service | default(service_image_tag) }}"
    migration_db: "auth_service{{ db_suffix }}"
    migration_stamp_revision: "20260405_0001"
    migration_stamp_probe_table: accounts
    migration_stamp_head_probe_table: accounts
    migration_stamp_head_revision: "20260405_0001"
    container_name: curs_auth_service
    env:
      AUTH_DATABASE_URL: "postgresql+psycopg://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/auth_service{{ db_suffix }}"
      AUTH_USE_INMEMORY: "0"
      AUTH_AUTO_CREATE_SCHEMA: "0"
      AUTH_JWT_ISSUER: auth_service
      AUTH_JWT_AUDIENCE: platform_clients
      AUTH_JWT_ACCESS_TTL_SECONDS: "3600"
      AUTH_JWT_REFRESH_TTL_SECONDS: "2592000"
      AUTH_JWT_PRIVATE_KEY_PEM: "{{ auth_jwt_private_key_pem }}"
      AUTH_JWT_PUBLIC_KEY_PEM: "{{ auth_jwt_public_key_pem }}"
      AUTH_METRICS_TOKEN: "{{ observability_metrics_token }}"
    migration_command:
      - alembic
      - upgrade
      - head
    ports:
      - "{{ api_public_bind_host }}:8000:8000"
    healthcheck:
      path: /healthz
      port: 8000

  users_service:
    enabled: true
    workdir: "{{ project_root }}/users_service"
    image: "{{ ghcr_registry }}/{{ ghcr_namespace }}/users_service"
    tag: "{{ service_image_tags.users_service | default(service_image_tag) }}"
    migration_db: "users_service{{ db_suffix }}"
    migration_stamp_revision: "20260406_0001"
    migration_stamp_probe_table: user_profiles
    migration_stamp_head_probe_table: user_profiles
    migration_stamp_head_revision: "20260406_0001"
    container_name: curs_users_service
    env:
      USERS_DATABASE_URL: "postgresql+psycopg://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/users_service{{ db_suffix }}"
      USERS_USE_INMEMORY: "0"
      USERS_AUTO_CREATE_SCHEMA: "0"
      USERS_AUTH_ISSUER: auth_service
      USERS_AUTH_AUDIENCE: platform_clients
      USERS_AUTH_JWKS_URL: "{{ auth_service_internal_url }}/.well-known/jwks.json"
      USERS_SERVICE_TOKEN: "{{ users_service_token }}"
      USERS_METRICS_TOKEN: "{{ observability_metrics_token }}"
    migration_command:
      - alembic
      - upgrade
      - head
    ports:
      - "{{ api_public_bind_host }}:8002:8002"
    healthcheck:
      path: /healthz
      port: 8002

  course_service:
    enabled: true
    workdir: "{{ project_root }}/course_service"
    image: "{{ ghcr_registry }}/{{ ghcr_namespace }}/course_service"
    tag: "{{ service_image_tags.course_service | default(service_image_tag) }}"
    migration_db: "course_service{{ db_suffix }}"
    migration_stamp_revision: "20260406_0001"
    migration_stamp_probe_table: course_owner_projections
    migration_stamp_head_probe_table: course_catalog
    migration_stamp_head_revision: "20260412_0002"
    container_name: curs_course_service
    env:
      COURSE_DATABASE_URL: "postgresql+psycopg://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/course_service{{ db_suffix }}"
      COURSE_USE_INMEMORY: "0"
      COURSE_AUTO_CREATE_SCHEMA: "0"
      COURSE_AUTH_ISSUER: auth_service
      COURSE_AUTH_AUDIENCE: platform_clients
      COURSE_AUTH_JWKS_URL: "{{ auth_service_internal_url }}/.well-known/jwks.json"
      COURSE_SERVICE_TOKEN: "{{ course_service_token }}"
      COURSE_USERS_SERVICE_BASE_URL: "{{ users_service_internal_url }}"
      COURSE_USERS_SERVICE_TOKEN: "{{ users_service_token }}"
      COURSE_USERS_SERVICE_TIMEOUT_SECONDS: "2"
      COURSE_BONUS_ENABLED: "1"
      COURSE_BONUS_COURSE_COMPLETION_POINTS: "25"
      COURSE_BONUS_SERVICE_BASE_URL: "{{ bonus_wallet_service_internal_url }}"
      COURSE_BONUS_SERVICE_TOKEN: "{{ bonus_wallet_service_token }}"
      COURSE_BONUS_SERVICE_TIMEOUT_SECONDS: "2"
      COURSE_METRICS_TOKEN: "{{ observability_metrics_token }}"
    migration_command:
      - alembic
      - upgrade
      - head
    ports:
      - "{{ api_public_bind_host }}:8001:8001"
    healthcheck:
      path: /healthz
      port: 8001

  attribution_service:
    enabled: true
    workdir: "{{ project_root }}/attribution_service"
    image: "{{ ghcr_registry }}/{{ ghcr_namespace }}/attribution-service"
    tag: "{{ service_image_tags.attribution_service | default(service_image_tag) }}"
    migration_db: "attribution_service{{ db_suffix }}"
    migration_stamp_revision: "20260412_0001"
    migration_stamp_probe_table: referral_tokens
    migration_stamp_head_probe_table: referral_tokens
    migration_stamp_head_revision: "20260412_0001"
    container_name: curs_attribution_service
    env:
      ATTR_DATABASE_URL: "postgresql+psycopg://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/attribution_service{{ db_suffix }}"
      ATTR_USE_INMEMORY: "0"
      ATTR_AUTO_CREATE_SCHEMA: "0"
      ATTR_AUTH_ISSUER: auth_service
      ATTR_AUTH_AUDIENCE: platform_clients
      ATTR_AUTH_JWKS_URL: "{{ auth_service_internal_url }}/.well-known/jwks.json"
      ATTR_SERVICE_TOKEN: "{{ attribution_service_token }}"
      ATTR_METRICS_TOKEN: "{{ observability_metrics_token }}"
    migration_command:
      - alembic
      - upgrade
      - head
    ports:
      - "{{ api_public_bind_host }}:8003:8000"
    healthcheck:
      path: /healthz
      port: 8003

  live_class_service:
    enabled: true
    workdir: "{{ project_root }}/live_class_service"
    image: "{{ ghcr_registry }}/{{ ghcr_namespace }}/live_class_service"
    tag: "{{ service_image_tags.live_class_service | default(service_image_tag) }}"
    container_name: curs_live_class_service
    env:
      LIVE_CLASS_HTTP_PORT: "8010"
      LIVE_CLASS_WS_NAMESPACE: "/ws/live"
      LIVE_CLASS_USE_INMEMORY: "1"
      LIVE_CLASS_MAX_STUDENTS: "10"
      LIVE_CLASS_MAX_PARTICIPANTS: "11"
      LIVE_CLASS_AUTH_ISSUER: auth_service
      LIVE_CLASS_AUTH_AUDIENCE: platform_clients
      LIVE_CLASS_AUTH_JWKS_URL: "{{ auth_service_internal_url }}/.well-known/jwks.json"
      LIVE_CLASS_COURSE_SERVICE_BASE_URL: "{{ course_service_internal_url }}"
      LIVE_CLASS_REDIS_URL: "{{ redis_internal_url }}"
      LIVE_CLASS_OUTBOX_STREAM: live_room.events
      LIVE_CLASS_OUTBOX_BATCH_SIZE: "100"
      LIVE_CLASS_OUTBOX_POLL_INTERVAL_MS: "1000"
      LIVE_CLASS_METRICS_TOKEN: "{{ observability_metrics_token }}"
      LIVE_CLASS_DATABASE_URL: "postgresql://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/live_class_service{{ db_suffix }}"
      LIVE_CLASS_TURN_URL: "turn:localhost:3478"
      LIVE_CLASS_TURN_USERNAME: turn-user
      LIVE_CLASS_TURN_PASSWORD: turn-password
    ports:
      - "{{ api_public_bind_host }}:8010:8010"
    healthcheck:
      path: /healthz
      port: 8010

  payments_service:
    enabled: true
    workdir: "{{ project_root }}/payments_service"
    image: "{{ ghcr_registry }}/{{ ghcr_namespace }}/payments_service"
    tag: "{{ service_image_tags.payments_service | default(service_image_tag) }}"
    migration_db: "payments_service{{ db_suffix }}"
    migration_stamp_revision: "20260412_0001"
    migration_stamp_probe_table: payment_intents
    migration_stamp_head_probe_table: payment_intents
    migration_stamp_head_revision: "20260412_0001"
    container_name: curs_payments_service
    env:
      PAYMENTS_DATABASE_URL: "postgresql+psycopg://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/payments_service{{ db_suffix }}"
      PAYMENTS_USE_INMEMORY: "0"
      PAYMENTS_AUTO_CREATE_SCHEMA: "0"
      PAYMENTS_INTEGRATIONS_USE_INMEMORY: "0"
      PAYMENTS_AUTH_ISSUER: auth_service
      PAYMENTS_AUTH_AUDIENCE: platform_clients
      PAYMENTS_AUTH_JWKS_URL: "{{ auth_service_internal_url }}/.well-known/jwks.json"
      PAYMENTS_SERVICE_TOKEN: "{{ payments_service_token }}"
      PAYMENTS_DEFAULT_CURRENCY: "USD"
      PAYMENTS_COURSE_SERVICE_BASE_URL: "{{ course_service_internal_url }}"
      PAYMENTS_COURSE_SERVICE_TOKEN: "{{ course_service_token }}"
      PAYMENTS_COURSE_SERVICE_TIMEOUT_SECONDS: "2"
      PAYMENTS_USERS_SERVICE_BASE_URL: "{{ users_service_internal_url }}"
      PAYMENTS_USERS_SERVICE_TOKEN: "{{ users_service_token }}"
      PAYMENTS_USERS_SERVICE_TIMEOUT_SECONDS: "2"
      PAYMENTS_ATTR_SERVICE_BASE_URL: "{{ attribution_service_internal_url }}"
      PAYMENTS_ATTR_SERVICE_TOKEN: "{{ attribution_service_token }}"
      PAYMENTS_ATTR_SERVICE_TIMEOUT_SECONDS: "2"
      PAYMENTS_BONUS_SERVICE_BASE_URL: "{{ bonus_wallet_service_internal_url }}"
      PAYMENTS_BONUS_SERVICE_TOKEN: "{{ bonus_wallet_service_token }}"
      PAYMENTS_BONUS_SERVICE_TIMEOUT_SECONDS: "2"
      PAYMENTS_METRICS_TOKEN: "{{ observability_metrics_token }}"
    migration_command:
      - alembic
      - upgrade
      - head
    ports:
      - "{{ api_public_bind_host }}:8004:8004"
    healthcheck:
      path: /healthz
      port: 8004

  bonus_wallet_service:
    enabled: true
    workdir: "{{ project_root }}/bonus_wallet_service"
    image: "{{ ghcr_registry }}/{{ ghcr_namespace }}/bonus_wallet_service"
    tag: "{{ service_image_tags.bonus_wallet_service | default(service_image_tag) }}"
    migration_db: "bonus_wallet_service{{ db_suffix }}"
    migration_stamp_revision: "20260509_0001"
    migration_stamp_probe_table: bonus_accounts
    migration_stamp_head_probe_table: bonus_rules
    migration_stamp_head_revision: "20260509_0001"
    container_name: curs_bonus_wallet_service
    env:
      BONUS_DATABASE_URL: "postgresql+psycopg://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/bonus_wallet_service{{ db_suffix }}"
      BONUS_USE_INMEMORY: "0"
      BONUS_AUTO_CREATE_SCHEMA: "0"
      BONUS_AUTH_ISSUER: auth_service
      BONUS_AUTH_AUDIENCE: platform_clients
      BONUS_AUTH_JWKS_URL: "{{ auth_service_internal_url }}/.well-known/jwks.json"
      BONUS_SERVICE_TOKEN: "{{ bonus_wallet_service_token }}"
      BONUS_METRICS_TOKEN: "{{ observability_metrics_token }}"
    migration_command:
      - alembic
      - upgrade
      - head
    ports:
      - "{{ api_public_bind_host }}:8006:8006"
    healthcheck:
      path: /healthz
      port: 8006

  web_app:
    enabled: true
    workdir: "{{ project_root }}/web_app"
    image: "{{ ghcr_registry }}/{{ ghcr_namespace }}/web_app"
    tag: "{{ service_image_tags.web_app | default(service_image_tag) }}"
    container_name: curs_web_app
    env:
      NUXT_PUBLIC_API_BASE_URL: "{{ auth_service_internal_url }}"
      NUXT_PUBLIC_SITE_URL: "http://localhost:3000"
    ports:
      - "{{ web_public_bind_host }}:3000:3000"
    healthcheck:
      path: /api/health
      port: 3000

  admin_app:
    enabled: true
    workdir: "{{ project_root }}/admin_app"
    image: "{{ ghcr_registry }}/{{ ghcr_namespace }}/admin_app"
    tag: "{{ service_image_tags.admin_app | default(service_image_tag) }}"
    container_name: curs_admin_app
    env:
      NUXT_PUBLIC_API_BASE_URL: "{{ auth_service_internal_url }}"
      NUXT_PUBLIC_SITE_URL: "http://localhost:3001"
    ports:
      - "{{ web_public_bind_host }}:3001:3000"
    healthcheck:
      path: /api/health
      port: 3001

  studio_app:
    enabled: true
    workdir: "{{ project_root }}/studio_app"
    image: "{{ ghcr_registry }}/{{ ghcr_namespace }}/studio_app"
    tag: "{{ service_image_tags.studio_app | default(service_image_tag) }}"
    container_name: curs_studio_app
    env:
      NUXT_PUBLIC_API_BASE_URL: "{{ auth_service_internal_url }}"
      NUXT_PUBLIC_SITE_URL: "http://localhost:3002"
    ports:
      - "{{ web_public_bind_host }}:3002:3000"
    healthcheck:
      path: /api/health
      port: 3002
