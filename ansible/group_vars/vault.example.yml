---
# Шаблон для ansible-vault (не коммитить реальные секреты)
# ansible-vault create group_vars/vault.yml

vault_auth_jwt_private_key_pem: "<PRIVATE_KEY_PEM>"
vault_auth_jwt_public_key_pem: "<PUBLIC_KEY_PEM>"
vault_ghcr_username: "<GHCR_USERNAME>"
vault_ghcr_token: "<GHCR_PERSONAL_ACCESS_TOKEN_OR_FINE_GRAINED_TOKEN>"
vault_course_service_token: "<COURSE_SERVICE_INTERNAL_TOKEN>"
vault_users_service_token: "<USERS_SERVICE_INTERNAL_TOKEN>"
vault_payments_service_token: "<PAYMENTS_SERVICE_INTERNAL_TOKEN>"
vault_attribution_service_token: "<ATTRIBUTION_SERVICE_INTERNAL_TOKEN>"
vault_bonus_wallet_service_token: "<BONUS_WALLET_SERVICE_INTERNAL_TOKEN>"
