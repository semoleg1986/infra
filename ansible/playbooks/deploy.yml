---
- name: Deploy selected services
  hosts: app
  become: true
  gather_facts: false
  vars:
    deploy_services: "{{ (services.keys() | list) if (target_services is not defined) else target_services }}"

  tasks:
    - name: Ensure shared docker network exists
      ansible.builtin.command:
        argv:
          - docker
          - network
          - create
          - "{{ docker_shared_network }}"
      register: network_create
      failed_when: network_create.rc not in [0, 1]
      changed_when: network_create.rc == 0

    - name: Validate selected services
      ansible.builtin.assert:
        that:
          - item in services
        fail_msg: "Сервис '{{ item }}' не найден в services (group_vars/all.yml)"
      loop: "{{ deploy_services }}"

    - name: Deploy each selected service
      ansible.builtin.include_role:
        name: compose_service
      vars:
        service_name: "{{ item }}"
        service: "{{ services[item] }}"
      loop: "{{ deploy_services }}"
      loop_control:
        label: "{{ item }}"

    - name: Check postgres container exists
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - curs_postgres
      register: postgres_container
      changed_when: false
      failed_when: false

    - name: Wait for postgres readiness
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - curs_postgres
          - pg_isready
          - -U
          - "{{ db_user }}"
          - -d
          - postgres
      register: postgres_ready
      changed_when: false
      retries: 20
      delay: 2
      until: postgres_ready.rc == 0
      when: postgres_container.rc == 0

    - name: Ensure postgres databases exist
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - curs_postgres
          - psql
          - -U
          - "{{ db_user }}"
          - -d
          - postgres
          - -c
          - "CREATE DATABASE \"{{ item }}\";"
      register: create_db_result
      changed_when: "'CREATE DATABASE' in create_db_result.stdout"
      failed_when: false
      loop: "{{ postgres_databases | default([]) }}"
      when: postgres_container.rc == 0

    - name: Inform if smoke check is skipped
      ansible.builtin.debug:
        msg: >-
          Post-deploy smoke check пропущен.
          Требуемые сервисы: {{ post_deploy_smoke_required_services }}.
          Запрошенные сервисы: {{ deploy_services }}.
      when:
        - post_deploy_smoke_enabled | default(false)
        - (post_deploy_smoke_required_services | difference(deploy_services)) | length > 0

    - name: Run production smoke check
      ansible.builtin.script: "{{ playbook_dir }}/../scripts/smoke_prod.sh"
      environment:
        AUTH_BASE_URL: "{{ smoke_auth_base_url }}"
        USERS_BASE_URL: "{{ smoke_users_base_url }}"
        COURSE_BASE_URL: "{{ smoke_course_base_url }}"
        ADMIN_EMAIL: "{{ smoke_admin_email }}"
        ADMIN_PASSWORD: "{{ smoke_admin_password }}"
        SERVICE_TOKEN: "{{ smoke_service_token }}"
      register: smoke_result
      changed_when: false
      when:
        - post_deploy_smoke_enabled | default(false)
        - (post_deploy_smoke_required_services | difference(deploy_services)) | length == 0

    - name: Show smoke summary
      ansible.builtin.debug:
        msg: "{{ smoke_result.stdout_lines | default([]) }}"
      when:
        - post_deploy_smoke_enabled | default(false)
        - (post_deploy_smoke_required_services | difference(deploy_services)) | length == 0
