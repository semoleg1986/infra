---
- name: Skip disabled services
  ansible.builtin.meta: end_role
  when: not (service.enabled | default(true))

- name: Ensure service directory exists
  ansible.builtin.file:
    path: "{{ service.workdir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render service env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ service.workdir }}/.env"
    owner: root
    group: root
    mode: "0640"

- name: Render service compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ service.workdir }}/{{ compose_filename }}"
    owner: root
    group: root
    mode: "0644"

- name: Pull service image
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ compose_filename }}"
      - pull
      - "{{ service_name }}"
  args:
    chdir: "{{ service.workdir }}"
  changed_when: true

- name: Start service
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ compose_filename }}"
      - up
      - -d
      - "{{ service_name }}"
  args:
    chdir: "{{ service.workdir }}"
  changed_when: true

- name: Check service health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ service.healthcheck.port }}{{ service.healthcheck.path }}"
    status_code: [200, 204]
  register: health_result
  retries: 20
  delay: 3
  until: health_result.status in [200, 204]
  when: service.healthcheck is defined
